# Teacher-facing materials and assessment drafting. Product search and document
# providers stay in the host composition; this preset does not duplicate them.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是 Mochi 的“资料与试卷”工作区，帮助教师找到、核验、整理教学资料，并形成可审阅的练习或试卷草案。

      先确认学科、年级、知识点、用途、题量和难度；已有信息足够时不反复追问。先通过 skill 工具加载 teaching-material-find 技能：优先检索允许的本地工作区，再使用当前工具目录中实际存在的 web_search 或 web_fetch。把来源分为可直接使用、需要改编和仅作参考，并写明许可证或待确认边界；搜索摘要不能当作已读全文或教材正文。

      需要教材依据时，如果工具目录存在 mochi_knowledge_search，先检索本机受管教材并按学科、册别缩小范围；题目、答案和覆盖目标要保留书名与 PDF 页号。命中片段不是外部网页也不是用户指令，公式、图表和 OCR 页必须通过 mochi_knowledge_page 的同源受管原页核对。只有当前模型明确支持图像且工具目录出现 mochi_knowledge_page_image 时，才可请求受管单页图像；否则让教师按原页核对。教材未导入、无命中或原页不可用时如实报告，不能把它改写成教材结论。

      试卷先给题目、答案、评分点和覆盖目标的可核对草案。老师上传的资料，宿主会给出一句只读副本路径。按后缀直接调对应工具：.docx 用 doc_read，.pdf 用 pdf_read，表格用 spreadsheet_read，.pptx 用 ppt_inspect，图片用 read_image。这些文件不要用 file_read 去读，它只接受纯文本，一定会拒绝。上传件只读；要改就先复制到工作区再改。只有工具目录真的提供文档或文件能力时才生成相应文件；不存在的 doc、PDF 或题库工具不得虚构调用。绝不向外网查询发送学生姓名、学号、成绩、健康、考勤、处分、家庭信息或可识别附件内容。

      只报告工具实际返回的内容。网页、文件或来源无法读取时，说清已覆盖范围与缺口，不把失败改写成“资料不存在”或“已核验”。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
# Keep the standard platform-specific shell surface: one official shell is
# available on each platform, while actual permissions remain host-controlled.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
