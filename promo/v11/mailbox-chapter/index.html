const clock={get time(){return filmTime},set time(t){filmTime=t;paintMo(t,16*Math.sin(t));const frame=document.getElementById('popup'),button=frame.contentDocument?.getElementById('p-open');if(!button)return;const r=frame.getBoundingClientRect(),b=button.getBoundingClientRect(),point={x:r.x+(b.x+b.width/2)*r.width/660,y:r.y+(b.y+b.height/2)*r.height/350};const progress=gsap.parseEase('power3.inOut')(Math.min(1,Math.max(0,(t-4.1)/.7)));gsap.set(p.cursor,{x:2160+(point.x-2160)*progress-4.5,y:1180+(point.y-1180)*progress-3,opacity:t>=4.1&&t<5.5?1:0});const pulse=(t-5.15)/.5;gsap.set(p.ring,{x:point.x-40,y:point.y-40,scale:.2+Math.max(0,pulse),opacity:pulse>=0&&pulse<1?.8*(1-pulse):0});frame.contentWindow.renderPopupAt?.(t)}};
