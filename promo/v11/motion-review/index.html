<!doctype html>
<html lang="zh-CN" data-mochi-pet-palette="caramel">
<head>
<meta charset="utf-8"><title>Mochi V11 内部转场检查</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion.js"></script>
<link rel="stylesheet" href="assets/source-components.css">
<link rel="stylesheet" href="assets/motion.css">
<style>
@font-face{font-family:'PingFang SC';src:local('PingFangSC-Regular')}
@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}
@font-face{font-family:'Songti SC';src:local('Songti SC')}
@font-face{font-family:'STSong';src:local('STSong')}
@font-face{font-family:'Source Han Serif SC';src:local('Source Han Serif SC')}
@font-face{font-family:'Noto Sans CJK SC';src:url('assets/NotoSansCJKsc-Regular.otf')}
@font-face{font-family:'Noto Serif CJK SC';src:url('assets/NotoSerifCJKsc-SemiBold.otf')}
@font-face{font-family:MoSans;src:url('assets/NotoSansCJKsc-Regular.otf')}
@font-face{font-family:MoSerif;src:url('assets/NotoSerifCJKsc-SemiBold.otf')}
*{box-sizing:border-box}html,body{margin:0}body{font-family:MoSans,sans-serif;color:#28382d}
#film{position:relative;width:2560px;height:1440px;overflow:hidden;background:#e6ecdf}
.object{position:absolute;left:0;top:0;transform-origin:0 0}
#model{width:1740px;height:1130px;overflow:hidden;border-radius:28px;background:white;box-shadow:0 22px 60px #33482a22}
#model video{display:block;width:1740px;height:1130px}
#request{width:900px;padding:46px;background:#faf9f6;border-radius:28px;box-shadow:0 22px 60px #33482a22}
#native-request{width:808px;font-size:14px}
#request-label{font-family:MoSans;font-size:28px;margin:0 0 24px;color:#5d6f53}
#native-team{width:550px}
#team{padding:32px;background:#faf9f6;border-radius:24px;box-shadow:0 20px 50px #33482a18}
#native-orb{width:270px;height:270px}
.headline{position:absolute;left:0;top:0;font-family:MoSerif;font-size:100px;line-height:1.2;white-space:nowrap}
.word{display:inline-block}.caption{position:absolute;left:200px;bottom:100px;font-size:38px;line-height:1.5}
#review-note{position:absolute;left:80px;top:48px;font-size:24px;color:#52604b}
#request-note{position:absolute;right:80px;bottom:42px;font-size:23px;color:#52604b}
</style></head>
<body><main id="film" data-composition-id="mochi-motion-review" data-width="2560" data-height="1440" data-duration="16" data-fps="120">
<div id="model" class="object"><video id="model-video" src="assets/model-demo-final.mp4" muted playsinline data-start="0" data-duration="16" data-track-index="1"></video></div>
<div id="request" class="object"><p id="request-label">来自教室的小信箱</p><div id="native-request" class="mochi-lan-mailbox"></div></div>
<div id="team" class="object"><div id="native-team"></div></div>
<div id="native-orb" class="object"></div>
<div id="title-a" class="headline"><span class="word">把知识，</span><span class="word">变得可触摸。</span></div>
<div id="title-b" class="headline"><span class="word">学生的问题，</span><span class="word">有人接住。</span></div>
<div id="title-c" class="headline"><span class="word">让校园里的工作，</span><span class="word">自然连接。</span></div>
<div id="caption" class="caption"></div>
<div id="review-note">内部转场检查 · 非完整成片</div>
<div id="request-note">模型为真实操作；信箱与团队为原组件示例</div>
</main><script src="assets/source-components.js"></script><script>
window.initMochiSources();
const tl=gsap.timeline({paused:true});
window.__timelines={'mochi-motion-review':tl};
const M=window.MochiMotion,p=M.createCursor(document.querySelector('#film'));
const paint={};Object.defineProperty(paint,'time',{get:()=>0,set:t=>window.paintMochi(t)});
tl.fromTo(paint,{time:0},{time:16,duration:16,ease:'none'},0);
tl.set('#model',{x:410,y:185,scale:1},0);
tl.set('#request',{x:1500,y:1700,scale:1.5,rotation:4},0);
tl.set('#team',{x:-850,y:750,scale:1.3,rotation:-8},0);
tl.set('#native-orb',{x:2140,y:1010,scale:.65},0);
tl.set('#title-a',{x:540,y:48},0);
tl.set('#title-b',{x:2550,y:200,opacity:0},0);
tl.set('#title-c',{x:320,y:650,opacity:0},0);
tl.fromTo('#title-a .word',{y:150,rotation:5,opacity:0},{y:0,rotation:0,opacity:1,duration:1,ease:'back.out(1.4)',stagger:.1},0);
// Same model object shrinks while playing, travelling out as the request enters.
M.place(tl,'#model',{x:410,y:185,scale:1,rotation:0},{x:80,y:-520,scale:.58,rotation:-3},5.2,1.6);
tl.to('#title-a',{y:-190,duration:1.1,ease:'power3.inOut'},5.2);
M.place(tl,'#request',{x:1500,y:1700,scale:1.5,rotation:4},{x:540,y:475,scale:1.65,rotation:0},5.35,1.45,'back.out(1.1)');
M.place(tl,'#title-b',{x:2400,y:240,opacity:0},{x:440,y:240,opacity:1},5.55,1.15);
tl.fromTo('#title-b .word',{y:70,rotation:3},{y:0,rotation:0,duration:.8,stagger:.1,ease:'back.out(1.2)',immediateRender:false},6);
// Read the target before introducing the pointer. The component is not altered by the click cue.
const button=document.querySelector('#native-request button');
const card=document.querySelector('#request');
const buttonRect=button.getBoundingClientRect(),cardRect=card.getBoundingClientRect();
const target={x:540+(buttonRect.x-cardRect.x+buttonRect.width*.5)*1.65,y:475+(buttonRect.y-cardRect.y+buttonRect.height*.5)*1.65};
window.pointerTarget=target;
M.movePointer(tl,p,{x:target.x+260,y:target.y+160},target,8.4,.8);
M.click(tl,p,target,9.5);
tl.to(p.cursor,{opacity:0,duration:.3},10.2);
// Return objects to a shared composition; do not replace the clicked example with fake success.
M.place(tl,'#request',{x:540,y:475,scale:1.65,rotation:0},{x:1650,y:210,scale:.72,rotation:5},11,1.3);
M.place(tl,'#model',{x:80,y:-520,scale:.58,rotation:-3},{x:70,y:70,scale:.46,rotation:-4},11,1.3);
M.place(tl,'#team',{x:-850,y:750,scale:1.3,rotation:-8},{x:160,y:950,scale:1.4,rotation:-3},11.15,1.35,'back.out(1.2)');
tl.to('#title-b',{x:2700,y:160,duration:1.1,ease:'power3.inOut'},11);
tl.fromTo('#title-c',{y:800,opacity:0},{y:650,opacity:1,duration:1.2,ease:'back.out(1.15)',immediateRender:false},11.6);
tl.fromTo('#title-c .word',{y:65,rotation:3},{y:0,rotation:0,duration:1,stagger:.14,ease:'back.out(1.3)',immediateRender:false},11.8);
M.place(tl,'#native-orb',{x:2140,y:1010,scale:.65},{x:1120,y:235,scale:1.1},11.2,1.5,'back.out(1.25)');
M.words(tl,document.querySelector('#caption'),'一次操作，接住下一件事。',12.5,1.1);
window.seekFilm=t=>tl.seek(t);
</script></body></html>
