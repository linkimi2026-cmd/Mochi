<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="assets/gsap.min.js"></script><script src="assets/native.js"></script><link rel="stylesheet" href="assets/native.css"><style>
@font-face{font-family:MoSans;src:url('assets/NotoSansCJKsc-Regular.otf')}@font-face{font-family:MoSans;src:url('assets/NotoSansCJKsc-Bold.otf');font-weight:700}*{box-sizing:border-box}body{margin:0}#film{width:2560px;height:1440px;position:relative;overflow:hidden;background:#f7f4e9;font-family:MoSans;color:#304637;perspective:2400px}#light{position:absolute;inset:-30%;background:radial-gradient(ellipse at 70% 20%,#e2efcf,transparent 55%),radial-gradient(ellipse at 20% 80%,#f1d8b5,transparent 48%)}#mo-actor{position:absolute;left:0;top:0;width:420px;height:420px;transform-origin:50% 50%;opacity:0;--mochi-orb-color:#a16b30;--mochi-orb-highlight:#fff0ce}#mo-actor *{animation:none!important}#shadow{position:absolute;left:0;top:0;width:410px;height:60px;border-radius:50%;background:#73502422;filter:blur(18px);opacity:0;transform-origin:center}h1{position:absolute;left:200px;top:850px;width:2160px;margin:0;text-align:center;font:700 116px/1.25 MoSans;letter-spacing:-4px;opacity:0}.glyph{display:inline-block}#home{position:absolute;inset:0;width:2560px;height:1440px;opacity:0;transform-origin:center;box-shadow:0 30px 90px #30463720}#home video{width:100%;height:100%;display:block}
</style></head><body><main id="film" data-composition-id="mochi-greeting" data-width="2560" data-height="1440" data-duration="5" data-fps="120"><div id="light"></div><div id="shadow"></div><div id="mo-actor"></div><h1 id="hello">哈喽，我是 Mochi。</h1><div id="home"><video id="home-video" class="clip" src="assets/home.mp4" muted data-start="4" data-duration="1" data-track-index="1"></video></div></main><script>
initGreeting();const tl=gsap.timeline({paused:true});window.__timelines={'mochi-greeting':tl};const h=document.querySelector('#hello');h.innerHTML=Array.from(h.textContent).map(c=>'<span class="glyph">'+(c===' '?'&nbsp;':c)+'</span>').join('');
tl.fromTo('#mo-actor',{x:-500,y:385,rotation:-540,scale:.92,opacity:1},{x:1070,y:360,rotation:0,scale:1,opacity:1,duration:1.15,ease:'power3.out',immediateRender:false},0);
tl.fromTo('#shadow',{x:-510,y:770,scale:.65,opacity:0},{x:1080,y:775,scale:1,opacity:1,duration:1.15,ease:'power3.out',immediateRender:false},0);
tl.to('#mo-actor',{y:320,rotation:7,duration:.23,ease:'power2.out'},1.15).to('#mo-actor',{y:360,rotation:0,duration:.45,ease:'bounce.out'},1.38);
tl.to('#shadow',{scale:.8,opacity:.55,duration:.23},1.15).to('#shadow',{scale:1,opacity:1,duration:.45},1.38);
tl.set('#hello',{opacity:1},1.22).fromTo('#hello .glyph',{y:60,rotation:3,opacity:0},{y:0,rotation:0,opacity:1,stagger:.035,duration:.5,ease:'back.out(1.35)',immediateRender:false},1.22);
tl.to('#hello',{y:-65,opacity:0,duration:.45,ease:'power2.in'},3.12);
tl.to('#mo-actor',{x:280,y:135,scale:.28,rotation:-12,duration:.85,ease:'power3.inOut'},3.05).to('#mo-actor',{opacity:0,duration:.3},3.65);
tl.to('#shadow',{x:330,y:255,scale:.28,opacity:0,duration:.85,ease:'power3.inOut'},3.05);
tl.fromTo('#home',{y:620,scale:.7,rotationX:9,opacity:0},{y:0,scale:1,rotationX:0,opacity:1,duration:.9,ease:'power3.inOut',immediateRender:false},3.1);
tl.to('#light',{x:160,y:90,duration:5,ease:'sine.inOut'},0);
let time=0;const clock={get time(){return time},set time(v){time=v;paintGreeting(v)}};tl.to(clock,{time:5,duration:5,ease:'none'},0);
</script></body></html>
