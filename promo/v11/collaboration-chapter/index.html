initMoActor();initCollaboration();const tl=gsap.timeline({paused:true});window.__timelines={'mochi-collaboration':tl};
function title(id,at,out){const e=document.querySelector(id);e.innerHTML=Array.from(e.textContent).map(c=>'<span class="char">'+c+'</span>').join('');tl.set(e,{opacity:1},at).fromTo(e.children,{y:70,rotation:3,opacity:0},{y:0,rotation:0,opacity:1,stagger:.022,duration:.6,ease:'back.out(1.25)',immediateRender:false},at).to(e,{y:-80,opacity:0,duration:.5},out)}

['#s0','#s1','#s2','#s3'].forEach((id,i)=>tl.fromTo(id,{x:180,y:35,opacity:0},{x:0,y:0,opacity:1,duration:.65,ease:'back.out(1.3)',immediateRender:false},3.5+i*2.1));

tl.to('#movement-approval',{x:-1300,y:150,rotationY:25,scale:1.1,opacity:0,duration:.9,ease:'power3.inOut'},12.7).to('#states',{x:1200,rotationY:-18,opacity:0,duration:.9,ease:'power3.inOut'},12.9);
tl.to('#mo-actor',{x:1080,y:480,scale:1,rotation:0,duration:1,ease:'back.out(1.1)'},13).to('#mo-actor',{x:1060,y:950,scale:.5,duration:1,ease:'power3.inOut'},14.1);

let time=0;const clock={get time(){return time},set time(v){time=v;paintMo(v%6,18*Math.sin(v*.9))}};tl.to(clock,{time:30,duration:30,ease:'none'},0);
