<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Mochi · 直接问，就能找到记录</title><script src="assets/gsap.min.js"></script><script src="assets/native.js"></script><script src="assets/motion.js"></script><link rel="stylesheet" href="assets/native.css"><link rel="stylesheet" href="assets/palettes.css"><link rel="stylesheet" href="assets/motion.css"><style>
