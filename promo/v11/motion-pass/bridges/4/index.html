<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>信件飞过，两端相连</title><script src="assets/gsap.min.js"></script><script src="assets/native.js"></script><script src="assets/paper-transfer.js"></script><link rel="stylesheet" href="assets/native.css"><link rel="stylesheet" href="assets/palettes.css"><link rel="stylesheet" href="assets/paper-transfer.css"><style>
 @font-face{font-family:Mo;src:url('assets/NotoSansCJKsc-Bold.otf');font-weight:700 900}@font-face{font-family:MoSerif;src:url('assets/NotoSerifCJKsc-SemiBold.otf')}
 *{box-sizing:border-box}body{margin:0}#film{position:relative;width:2560px;height:1440px;overflow:hidden;background:#f5f1e8;color:#294138;perspective:2400px}#world{position:absolute;inset:-20%;background:radial-gradient(ellipse at 70% 20%,#dce8d7,transparent 55%),radial-gradient(ellipse at 25% 90%,#e8dfcc,transparent 60%)}#art{position:absolute;inset:0;opacity:0;mask-image:linear-gradient(transparent 0%,transparent 29%,#000 49%)}.work{position:absolute;width:650px;box-shadow:0 24px 55px #263e3020;opacity:.82}.screen{position:absolute;inset:0;transform-origin:50% 50%;backface-visibility:hidden;overflow:hidden;box-shadow:0 35px 90px #2d493326}video{width:2560px;height:1440px;display:block}#incoming{opacity:0}#mo-actor{position:absolute;left:0;top:0;width:420px;height:520px;opacity:0;z-index:6;filter:drop-shadow(0 22px 28px #33432b20)}#mo-actor .orb-companion__laptop{display:none}#words{position:absolute;left:150px;top:70px;font-size:90px;font-family:Mo;font-weight:900;line-height:1.22;letter-spacing:-4px;margin:0;z-index:5;opacity:0}#words em{font-family:MoSerif;font-style:normal;font-weight:600}.glyph{display:inline-block}#paper-seed{position:absolute;left:-4000px;width:650px}#paper-seed img{width:650px}.courier-content{margin:0!important;width:700px!important}.courier-content img{width:700px!important}
 </style></head><body><main id="film" data-composition-id="mochi-bridge-4" data-width="2560" data-height="1440" data-duration="3.4" data-fps="120"><div id="world"></div><div id="art"></div><div id="outgoing" class="screen"><video id="out-video" class="clip" src="assets/out.mp4" muted data-start="0" data-duration="3.4" data-track-index="1"></video></div><div id="incoming" class="screen"><video id="in-video" class="clip" src="assets/in.mp4" muted data-start="0" data-duration="3.4" data-track-index="2"></video></div><h1 id="words">一封信。<br>校园，就近了一点。</h1><div id="mo-actor" data-mochi-pet-palette="caramel"></div><div id="paper-seed"><img src="assets/mail-source.png"/></div></main><script>
 initMoActor();const d=3.4,tl=gsap.timeline({paused:true});window.__timelines={'mochi-bridge-4':tl};const rest={x:0,y:0,scale:1,rotation:0,rotationX:0,rotationY:0};
 const heading=document.querySelector('#words');for(const n of [...heading.childNodes,...heading.querySelectorAll('em')].flatMap(n=>n.nodeType===3?[n]:n.tagName==='EM'?[...n.childNodes]:[]).flat()){if(n.nodeType!==3)continue;const f=document.createDocumentFragment();for(const c of n.textContent){const s=document.createElement('span');s.className='glyph';s.textContent=c;f.append(s)}n.replaceWith(f)}
 tl.set('#incoming',{opacity:1},d*.06);
 function actor(x0,y0,x1,y1,x2,y2){tl.fromTo('#mo-actor',{x:x0,y:y0,scale:.18,rotation:-42,opacity:0},{x:x1,y:y1,scale:.55,rotation:0,opacity:1,duration:d*.38,ease:'power3.out',immediateRender:false},d*.08).to('#mo-actor',{x:x2,y:y2,scale:.2,rotation:32,opacity:0,duration:d*.34,ease:'power3.in'},d*.56)}

  tl.to('#outgoing',{x:-840,y:120,scale:.48,rotationY:12,duration:d*.3,ease:'power3.inOut'},d*.03);
  tl.fromTo('#incoming',{x:2550,y:190,scale:.62,rotationY:-15},{x:980,y:190,scale:.62,rotationY:0,duration:d*.4,ease:'power3.out'},d*.05);
  tl.to('#outgoing',{x:-3000,rotationY:0,duration:d*.39,ease:'power3.inOut'},d*.55);
  tl.to('#incoming',{...rest,duration:d*.4,ease:'power3.inOut'},d*.57);
  const seed=document.querySelector('#paper-seed');
  MochiPaper.transfer(tl,{stage:document.querySelector('#film'),source:seed,at:d*.03,from:{x:430,y:810},to:{x:2100,y:640},duration:d*.42,form:'envelope'});
  actor(50,1100,920,1080,1880,920);

 tl.fromTo('#world',{x:-60,y:30,scale:1},{x:100,y:-100,scale:1.13,duration:d,ease:'sine.inOut'},0);
 tl.to('#art',{opacity:1,duration:d*.14},d*.12).to('#art',{opacity:0,duration:d*.15},d*.71);
 document.querySelectorAll('.work').forEach((e,j)=>{const col=j%3,row=Math.floor(j/3),x=[-180,920,2020][col],y=row*800-170;
 tl.fromTo(e,{x,y:y+(col===1?-380:450),rotation:(j%2?8:-9),scale:.8},{x:x+(col-1)*120,y:y+(col===1?550:-470),rotation:j%2?1:-2,scale:1,duration:d,ease:'sine.inOut',immediateRender:false},0)});
 tl.set('#words',{opacity:1},d*.21).fromTo('#words .glyph',{y:55,rotation:3,opacity:0},{y:0,rotation:0,opacity:1,duration:d*.16,stagger:.014,ease:'back.out(1.15)',immediateRender:false},d*.21);
 tl.to('#words',{y:-45,opacity:0,duration:d*.15,ease:'power2.in'},d*.58);
 let time=0;const clock={get time(){return time},set time(v){time=v;paintMo(v,18*Math.sin(v*.8))}};tl.to(clock,{time:d,duration:d,ease:'none'},0);
 </script></body></html>
