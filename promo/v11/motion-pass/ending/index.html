</style></head><body><main id="film" data-composition-id="mochi-ending" data-width="2560" data-height="1440" data-duration="8" data-fps="120"><div id="light"></div><div id="shadow"></div><div id="mo-actor"></div><h1><span>M</span><span>o</span><span>c</span><span>h</span><span>i</span><span>已</span><span>至</span><span>。</span></h1><p>让校园里的工作，自然连接。</p></main><script>
initMoActor();const tl=gsap.timeline({paused:true});window.__timelines={'mochi-ending':tl};
tl.fromTo('#mo-actor',{x:2300,y:250,scale:.2,rotation:16,opacity:0},{x:1060,y:180,scale:1.08,rotation:0,opacity:1,duration:1.5,ease:'back.out(1.3)',immediateRender:false},0);

let time=0;const clock={get time(){return time},set time(v){time=v;paintMo(Math.min(v,5.9),-12*Math.sin(v*.55))}};tl.to(clock,{time:8,duration:8,ease:'none'},0);
