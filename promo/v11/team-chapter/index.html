<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Mochi · 一起完成</title><script src="assets/gsap.min.js"></script><script src="assets/motion.js"></script><link rel="stylesheet" href="assets/motion.css"><link rel="stylesheet" href="assets/native.css"><link rel="stylesheet" href="assets/palettes.css"><script src="assets/native.js"></script><style>

*{box-sizing:border-box}body{margin:0;color:#303b31;font-family:MoSans}#film{width:2560px;height:1440px;position:relative;overflow:hidden;background:#f5f1e8}h1,h2,p{margin:0}.copy{position:absolute;z-index:4;opacity:0}.glyph{display:inline-block;opacity:0}#intro{left:150px;top:130px;font:900 138px/1.3 MoSans;letter-spacing:-6px}#plan-title{left:1750px;top:860px;width:700px;font:700 78px/1.4 MoSans}#deck-title{left:130px;top:260px;width:700px;font:600 98px/1.4 MoSerif}#color-title{left:150px;top:130px;font:700 108px/1.4 MoSans}#colors-sub{left:154px;top:310px;font:40px MoSans}#roster{position:absolute;width:920px;height:100px;transform-origin:0 0;left:0;top:0}#roster video{width:100%;height:100%;display:block}.camera{position:absolute;width:2160px;height:1376px;transform-origin:0 0;opacity:0}.camera video{width:100%;height:100%;clip-path:inset(0 20px 25px 0)}#characters{position:absolute;inset:450px 170px auto;display:flex;gap:60px;justify-content:space-around;opacity:0}.character{display:flex;align-items:center;flex-direction:column;gap:56px;transform-origin:50% 50%}.character p{font:34px MoSans}#note{position:absolute;bottom:35px;left:80px;font:25px MoSans;color:#566258}
</style></head><body><main id="film" data-composition-id="mochi-team" data-width="2560" data-height="1440" data-duration="24" data-fps="120">

initTeamPalette();const tl=gsap.timeline({paused:true});window.__timelines={'mochi-team':tl};const M=window.MochiMotion,p=M.createCursor(document.querySelector('#film'));

M.place(tl,'#deck-camera',{x:1070,y:1480,scale:.75},{x:920,y:215,scale:.7},11.75,.8);tl.set('#deck-camera',{opacity:1},11.75);tl.to('#deck-camera',{y:-1000,rotation:4,opacity:0,duration:.8,ease:'power3.in'},18.2);
M.movePointer(tl,p,{x:2400,y:1080},{x:793,y:278},5.8,.6);M.click(tl,p,{x:793,y:278},6.4);tl.to(p.cursor,{opacity:0,duration:.15},6.9);
M.movePointer(tl,p,{x:1800,y:1150},{x:1275,y:745},14,.65);M.click(tl,p,{x:1275,y:745},14.7);tl.to(p.cursor,{opacity:0,duration:.2},15.4);
tl.set('#characters',{opacity:1},18.8).fromTo('.character',{y:1050,rotation:8,scale:.6},{y:0,rotation:0,scale:1.25,stagger:.12,duration:1.1,ease:'back.out(1.2)',immediateRender:false},18.8).fromTo('#colors-sub',{y:20,opacity:0},{y:0,opacity:1,duration:.4,immediateRender:false},19.9);
let filmTime=0;const clock={get time(){return filmTime},set time(t){filmTime=t;window.paintCharacters(t)}};tl.to(clock,{time:24,duration:24,ease:'none'},0);tl.to('#note',{opacity:0,duration:.2},18.6);tl.to('#characters',{y:200,opacity:0,duration:.45},23.55);tl.to('#colors-sub',{opacity:0,duration:.25},23.55);
