# Mochi runtime core. This file is rendered into every managed profile.
# Change this template or runtime-profile.json; runtime copies are generated.

- id: system-prompt
  # 此处只维护默认身份；公共质量规则见 plugins/mochi-hello/work-quality.md。
  # 角色persona会覆盖本段；独立质量section由各角色共有的mochi-hello注入。
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    persona: >-
      我是 Mochi，嘉行联校园工作伙伴，帮助老师、学生与校园岗位完成获授权的任务。
      产品名是 Mochi；底层模型、版本和开发者仅按可信运行信息回答，未知就说无法确认。
      像可靠同事一样说话，结果在前，依据清楚，简短但不省略关键条件。
      通用工作标准由 mochi-hello 的独立 mochi:work-quality section 注入，角色预设负责职责与权限。

- id: skill-filesystem
  # dsh-web-app disables the host row. Re-enable it so the standard Agent can
  # receive the deployment-level Mochi skills without replacing the preset.
  disabled: false
  config:
    providerName: filesystem
    includeDefaultRoots: false
    customSkillDirs:
      - __MOCHI_SKILLS_DIR_JSON__

- id: session-telemetry-otel
  config:
    mode: DISABLED

- id: plugin-package-inventory-deepseek
  disabled: true

# ─── Mochi 免费检索提供方（2026-09-06）─────────────────────────────────
# base bundle 已挂载完整 web 栈（web 服务 + deepseek 搜索后端 + http fetch +
# tool-web）；web-app 按 preset 组合 tool-web，standard preset 自带 web_search。
# 唯一要改的是提供方：原 searchProvider: deepseek-official 需要 DEEPSEEK_API_KEY
#（Mochi 走 glm，没有该凭据），这里整行替换为 mochi-free-web。
# 提供方插件 mochi-web-search 经 runtime-profile 生成器注入（三 profile 同挂）：
# SearXNG 全网（MOCHI_SEARXNG_ENDPOINT，mochi.sh 默认 127.0.0.1:8888）+
# OpenAlex/Crossref/arXiv 无 key 学术源扇出，权威域名加权排序。
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: mochi-free-web
    fetchProvider: http

# ─── 思考型端点上的辅助调用配额（2026-09-19 实测后修正）──────────────────
# 背景：mochi-aiaaa 背后的网关对 deepseek-v4.1-flash 会非确定性地路由到
# 「思考」与「不思考」两类后端；命中思考后端时，reasoning_content 会先吃
# 掉输出配额，正文才可能出现。实测（2026-09-18，见
# docs/gateway-aiaaa-verified-facts.md）：
#   · max_tokens=64  → 流式 6 次中 1 次、非流式 5 次中 2 次拿到空 content
#                      且 finish_reason=length；
#   · 该网关忽略 thinking:{type:disabled}、enable_thinking=false 与
#     reasoning_effort 的 none/off/minimal/low/medium/high/max（八种取值
#     返回逐字节相同的正文），因此无法从客户端关掉思考；
#   · 唯一可靠的杠杆是把配额抬到思考预算之上：标题任务实测思考约 220–260
#     token，cap=1024 与 cap=4096 各 2/2 成功。
# base bundle 给标题插件的是 maxOutputTokens: 64 —— 在那条配额下，
# session-title-llm 的 finishError 会把「思考吃满配额」判成硬失败并抛
# `title output reached maxOutputTokens`，教师端表现为会话列表大面积没有标题。
# 注意：dsh 的行补丁是 config 整体替换而非深合并，且该插件声明了未知键即报错，
# 所以下面必须写全 5 个必填字段（不得只写 maxOutputTokens）。
- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 2048
    timeoutMs: 60000

# 同一根因的第二处：压缩摘要。compaction-basic 的默认 maxTokens 是 8192，
# 而 60 行会话记录的摘要实测思考已用到 2831 token（余量仅约 2.9 倍）。
# 摘要为空时 summarizer 会抛 `summarization produced no text summary content`，
# 属于 fail-safe（不会把历史替换成空），但压缩一旦失败，长会话就撞上下文墙。
# 抬到 16384 留出余量；思考会自行收敛（实测 2831–4513 token 后开始输出正文）。
#
# ⚠️ 这里**不放** compaction-basic 行（2026-09-19 实测后修正）：
# dsh-web-app 已把宿主面的该行置为 `disabled: true`（其注释写明「只有读取
# token meter 的压缩后端移进 preset」），而 dsh 的行补丁只整体替换 config、
# 不会碰 disabled —— 写在这里就是一行不生效的死配置。真实位置在 preset 自己的
# 压缩组，已同步为 maxTokens: 16384：
#   · client-plugins/teacher-agent-presets/{lesson-planning,materials-assessment,
#     grade-analysis,classroom-coordination}/agent.cordis.yml
#   · apps/desktop/resources/mochi-web/classroom-agent-presets/classroom/agent.cordis.yml
# （验证：--dump-config 里那行若显示 disabled: true 即说明又打在了宿主面上。）
# 已知缺口：上游 cordis preset（教师端「创造模式」）的 compaction-basic 无 config，
# 仍吃默认 8192；覆盖它需走 vendored 包补丁，暂未做，见 WORKLOG 遗留项。
